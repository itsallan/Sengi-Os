[workspace]
resolver = "2"
members = ["crates/sengi-focus", "crates/sengi-tokens", "crates/sengi-ui"]
exclude = ["crates/sengi-compositor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/itsallan/Sengi-Os"

[workspace.dependencies]
slint = { version = "1.8", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-software"] }
slint-build = "1.8"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
