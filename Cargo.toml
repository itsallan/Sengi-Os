[workspace]
resolver = "2"
members = ["crates/sengi-bar", "crates/sengi-dock", "crates/sengi-focus", "crates/sengi-launcher", "crates/sengi-layer", "crates/sengi-notify", "crates/sengi-quick", "crates/sengi-tokens", "crates/sengi-ui"]

[workspace.package]
version = "0.5.0"
edition = "2021"
repository = "https://github.com/itsallan/Sengi-Os"

[workspace.dependencies]
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-software"] }
slint-build = "1.18"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
