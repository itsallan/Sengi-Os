[workspace]
resolver = "2"
members = ["crates/sengi-apps", "crates/sengi-bar", "crates/sengi-brightness", "crates/sengi-calc", "crates/sengi-calendar", "crates/sengi-clock", "crates/sengi-config", "crates/sengi-desktop", "crates/sengi-dock", "crates/sengi-edit", "crates/sengi-files", "crates/sengi-focus", "crates/sengi-greeter", "crates/sengi-install", "crates/sengi-installer", "crates/sengi-launcher", "crates/sengi-layer", "crates/sengi-lock", "crates/sengi-notify", "crates/sengi-open", "crates/sengi-osd", "crates/sengi-shot", "crates/sengi-snip", "crates/sengi-quick", "crates/sengi-settings", "crates/sengi-shots", "crates/sengi-store", "crates/sengi-system", "crates/sengi-text", "crates/sengi-tokens", "crates/sengi-ui", "crates/sengi-update", "crates/sengi-view", "crates/sengi-wallpapers"]
exclude = ["crates/sengi-compositor"]

[workspace.package]
version = "0.8.0"
edition = "2021"
repository = "https://github.com/itsallan/Sengi-Os"
license = "GPL-3.0-or-later"

[workspace.dependencies]
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-software"] }
slint-build = "1.18"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
