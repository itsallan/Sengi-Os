# Settings for cargo-about, which writes the licence notices of the Rust
# crates our programs are built from. Only licences listed here are
# accepted: a new dependency under any other licence stops the script until
# somebody has read it.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
]
# Only what ends up in the programs, on the one target we ship.
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = ["x86_64-unknown-linux-gnu"]
no-clearly-defined = true
