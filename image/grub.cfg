# Boot straight into the live system. Hold Shift or press Esc for the menu.
set timeout_style=hidden
set timeout=0

menuentry "Sengi OS @VERSION@" {
	linux /live/vmlinuz boot=sengi quiet loglevel=3 systemd.show_status=false rd.udev.log_level=3
	initrd /live/initrd.img
}

menuentry "Sengi OS @VERSION@ (verbose boot)" {
	linux /live/vmlinuz boot=sengi
	initrd /live/initrd.img
}
