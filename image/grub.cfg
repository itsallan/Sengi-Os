# Boot straight into the live system. Hold Shift or press Esc for the menu.
# Pressing L while the machine starts picks the labwc entry directly.
set timeout_style=hidden
set timeout=0

menuentry "Sengi OS @VERSION@" {
	linux /live/vmlinuz boot=sengi quiet loglevel=3 systemd.show_status=false rd.udev.log_level=3
	initrd /live/initrd.img
}

menuentry "Sengi OS @VERSION@ (verbose boot)" {
	linux /live/vmlinuz boot=sengi
	initrd /live/initrd.img
}

# labwc in place of sengi-compositor, the way back if the default does not
# work with the graphics. The word beats every other selector, see
# /usr/lib/sengi-os/compositor.sh. Pressing L while the machine starts picks
# it directly.
menuentry "Sengi OS @VERSION@ (labwc compositor)" --hotkey=l {
	linux /live/vmlinuz boot=sengi quiet loglevel=3 systemd.show_status=false rd.udev.log_level=3 sengi.compositor=labwc
	initrd /live/initrd.img
}
