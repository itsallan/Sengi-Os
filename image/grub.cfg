# Boot straight into the live system. Hold Shift or press Esc for the menu.
# Pressing P while the machine starts picks the compositor preview directly.
set timeout_style=hidden
set timeout=0

menuentry "Sengi OS @VERSION@" {
	linux /live/vmlinuz boot=sengi quiet loglevel=3 systemd.show_status=false rd.udev.log_level=3
	initrd /live/initrd.img
}

menuentry "Sengi OS @VERSION@ (verbose boot)" {
	linux /live/vmlinuz boot=sengi
	initrd /live/initrd.img
}

# Our own compositor in place of labwc, to try on real hardware. The word on
# the command line is read by /usr/bin/sengi-session.
menuentry "Sengi OS @VERSION@ (sengi-compositor preview)" --hotkey=p {
	linux /live/vmlinuz boot=sengi quiet loglevel=3 systemd.show_status=false rd.udev.log_level=3 sengi.compositor=own
	initrd /live/initrd.img
}

# labwc, whatever else asks for ours: the word beats the other selectors.
menuentry "Sengi OS @VERSION@ (labwc compositor)" {
	linux /live/vmlinuz boot=sengi quiet loglevel=3 systemd.show_status=false rd.udev.log_level=3 sengi.compositor=labwc
	initrd /live/initrd.img
}
