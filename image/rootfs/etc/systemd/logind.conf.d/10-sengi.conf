# What the lid and the power button do, for the whole computer.
#
# Closing the lid puts the computer to sleep, on the battery and on mains
# power. Docked, with a screen and a keyboard on a dock, it does nothing.
# sengi-settings can make the lid do nothing for one user (Settings, Power)
# by asking logind not to act on it; this is what applies otherwise, and
# whenever no session is there to ask.
#
# A short press of the power button puts the computer to sleep; holding it
# switches the computer off. The screen is locked before it sleeps, see
# /usr/lib/systemd/system-sleep/sengi-lock-on-sleep.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
