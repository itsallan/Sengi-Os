# Swap lives on zram, so swapping early is cheap and readahead is pointless.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0

# With transparent hugepages on, the kernel raises its free-memory reserve to
# about 67 MB no matter how much RAM there is. Put it back to what a 16 GB
# machine gets by default.
vm.min_free_kbytes = 16384
