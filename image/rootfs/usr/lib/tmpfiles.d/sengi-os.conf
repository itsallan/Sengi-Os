# Where compositor.sh notes, for this boot, that sengi-compositor failed.
# Open to every user: the login screen and the session run as different ones.
# 1777 on purpose, for a machine with one user: the worst another local user
# can do with it is write the file and so send the rest of the boot to labwc.
# No groups are made for it.
d /run/sengi-os 1777 root root -
