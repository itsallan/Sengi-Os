name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# GitHub's package mirror stalls now and then. Give up on a stuck download
# quickly and try again instead of hanging the job.
env:
  APT_OPTS: -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=180
  # Never stop to ask a question nobody is there to answer.
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: |
          shellcheck -s sh -S warning scripts/*.sh image/*.sh \
            image/rootfs/usr/bin/* image/rootfs/usr/libexec/* \
            image/rootfs/etc/initramfs-tools/hooks/* image/rootfs/etc/initramfs-tools/scripts/*
      - name: Generated files are current
        run: scripts/render-tokens.sh --check
      - name: No one-off styles
        run: scripts/lint-styles.sh

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        timeout-minutes: 10
        run: |
          sudo -E apt-get $APT_OPTS update -q
          sudo -E apt-get $APT_OPTS install -y -q --no-install-recommends pkg-config libfontconfig1-dev libxkbcommon-dev
          rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      # A build of the whole workspace shares cargo features between the
      # programs, so one that uses a feature of a shared crate without
      # asking for it still compiles there. On its own it does not.
      - name: Each program on its own
        run: |
          for program in sengi-bar sengi-dock sengi-focus sengi-launcher sengi-notify sengi-quick; do
            cargo check --locked -p "$program"
          done

  # Types into a real layer surface under a headless compositor. New, so it
  # reports without blocking until it has proved steady on the runners.
  keyboard:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and tools
        timeout-minutes: 10
        run: |
          sudo -E apt-get $APT_OPTS update -q
          sudo -E apt-get $APT_OPTS install -y -q --no-install-recommends \
            pkg-config libfontconfig1-dev libxkbcommon-dev labwc wtype libx11-data fonts-inter
          rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-keyboard-${{ hashFiles('Cargo.lock') }}
      - name: Build the typing example
        run: cargo build --locked -p sengi-layer --example typing
      - name: Keyboard input
        run: crates/sengi-layer/tests/keyboard.sh target/debug/examples/typing

  iso:
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the ISO
        run: scripts/build-iso.sh
      - name: Install QEMU and allow KVM
        timeout-minutes: 10
        run: |
          sudo -E apt-get $APT_OPTS update -q
          sudo -E apt-get $APT_OPTS install -y -q --no-install-recommends qemu-system-x86 qemu-utils
          # Let the runner's user open KVM. Setting the mode directly cannot
          # hang the way waiting on udev can.
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true
      - name: Boot test
        run: scripts/boot-test.sh out/sengi-os-$(cat VERSION)-amd64.iso test-output
      - name: Summary
        if: always()
        run: |
          {
            echo '### Boot test'
            echo '```'
            cat test-output/metrics.txt 2>/dev/null || echo 'no metrics recorded'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-test
          path: |
            test-output/*.png
            test-output/metrics.txt
            test-output/guest-info.txt
            test-output/serial.log
      - uses: actions/upload-artifact@v4
        with:
          name: iso
          path: |
            out/*.iso
            out/*.sha256
          retention-days: 7
          compression-level: 0
