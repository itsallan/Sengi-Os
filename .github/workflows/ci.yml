name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# GitHub's package mirror stalls now and then. Give up on a stuck download
# quickly and try again instead of hanging the job.
env:
  APT_OPTS: -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=180
  # Never stop to ask a question nobody is there to answer.
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: |
          shellcheck -s sh -S warning scripts/*.sh image/*.sh \
            image/rootfs/usr/bin/* image/rootfs/usr/libexec/* image/rootfs/usr/lib/sengi-os/*.sh \
            image/rootfs/etc/initramfs-tools/hooks/* image/rootfs/etc/initramfs-tools/scripts/*
      - name: Compositor selection and fallback
        run: scripts/test-compositor-sh.sh
      - name: Generated files are current
        run: scripts/render-tokens.sh --check
      - name: No one-off styles
        run: scripts/lint-styles.sh

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        timeout-minutes: 10
        run: |
          sudo -E apt-get $APT_OPTS update -q
          sudo -E apt-get $APT_OPTS install -y -q --no-install-recommends pkg-config libfontconfig1-dev libxkbcommon-dev libpam0g-dev
          rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      # A build of the whole workspace shares cargo features between the
      # programs, so one that uses a feature of a shared crate without
      # asking for it still compiles there. On its own it does not.
      - name: Each program on its own
        run: |
          for program in sengi-bar sengi-clock sengi-config sengi-dock sengi-focus sengi-greeter sengi-install sengi-installer sengi-launcher sengi-lock sengi-notify sengi-quick sengi-settings; do
            cargo check --locked -p "$program"
          done

  # sengi-compositor is a workspace of its own, so that nothing else has
  # to build Smithay. Its tests start it headless and talk to it as clients.
  compositor:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/sengi-compositor
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        timeout-minutes: 10
        run: |
          sudo -E apt-get $APT_OPTS update -q
          sudo -E apt-get $APT_OPTS install -y -q --no-install-recommends pkg-config \
            libxkbcommon-dev libseat-dev libinput-dev libudev-dev libgbm-dev libpixman-1-dev \
            fonts-inter xwayland libegl1
          rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/sengi-compositor/target
          key: cargo-compositor-${{ hashFiles('crates/sengi-compositor/Cargo.lock') }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # What the image is built with: no window backend, no test switches.
      - name: Clippy, as built for the image
        run: cargo clippy --locked --no-default-features --features drm -- -D warnings
      - name: Tests
        run: cargo test --locked

  # Types into a real layer surface under a headless compositor. New, so it
  # reports without blocking until it has proved steady on the runners.
  keyboard:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and tools
        timeout-minutes: 10
        run: |
          sudo -E apt-get $APT_OPTS update -q
          sudo -E apt-get $APT_OPTS install -y -q --no-install-recommends \
            pkg-config libfontconfig1-dev libxkbcommon-dev labwc wtype libx11-data fonts-inter
          rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-keyboard-${{ hashFiles('Cargo.lock') }}
      - name: Build the typing example
        run: cargo build --locked -p sengi-layer --example typing
      - name: Keyboard input
        run: crates/sengi-layer/tests/keyboard.sh target/debug/examples/typing

  iso:
    runs-on: ubuntu-24.04
    needs: [lint, compositor]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the ISO
        run: scripts/build-iso.sh
      - name: Install QEMU and allow KVM
        timeout-minutes: 10
        run: |
          sudo -E apt-get $APT_OPTS update -q
          sudo -E apt-get $APT_OPTS install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf
          # Let the runner's user open KVM. Setting the mode directly cannot
          # hang the way waiting on udev can.
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true
      - name: Boot test
        run: scripts/boot-test.sh out/sengi-os-$(cat VERSION)-amd64.iso test-output
      # Installs onto a blank disk image through the installer's window,
      # then starts that disk alone. The only disk written is the image
      # file the script makes.
      - name: Install test
        run: scripts/install-test.sh out/sengi-os-$(cat VERSION)-amd64.iso test-output/install
      # The same through UEFI, which is how the target machine starts.
      - name: Install test, UEFI
        run: |
          SENGI_UEFI=/usr/share/OVMF/OVMF_CODE_4M.fd SENGI_UEFI_VARS=/usr/share/OVMF/OVMF_VARS_4M.fd \
            scripts/install-test.sh out/sengi-os-$(cat VERSION)-amd64.iso test-output/install-uefi
      # The steps above run sengi-compositor, the default. labwc is the way
      # back, so it is kept working: one boot and one BIOS install.
      - name: Boot test, labwc
        run: SENGI_COMPOSITOR=labwc scripts/boot-test.sh out/sengi-os-$(cat VERSION)-amd64.iso test-output/labwc
      - name: Install test, labwc
        run: SENGI_COMPOSITOR=labwc scripts/install-test.sh out/sengi-os-$(cat VERSION)-amd64.iso test-output/install-labwc
      # Windows must also appear on a small screen, where the apps are bigger
      # than what the bar and dock leave free.
      - name: Boot test, small screen
        run: SENGI_SCREEN=800x600 scripts/boot-test.sh out/sengi-os-$(cat VERSION)-amd64.iso test-output/small
      - name: Summary
        if: always()
        run: |
          {
            echo '### Boot test'
            echo '```'
            cat test-output/metrics.txt 2>/dev/null || echo 'no metrics recorded'
            echo '```'
            echo '### Install test'
            echo '```'
            cat test-output/install/install-metrics.txt 2>/dev/null || echo 'no metrics recorded'
            echo '```'
            echo '### Install test, UEFI'
            echo '```'
            cat test-output/install-uefi/install-metrics.txt 2>/dev/null || echo 'no metrics recorded'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-test
          path: |
            test-output/*.png
            test-output/metrics.txt
            test-output/labwc/*.png
            test-output/labwc/metrics.txt
            test-output/small/*.png
            test-output/small/metrics.txt
            test-output/guest-info.txt
            test-output/serial.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-test
          path: |
            test-output/install*/*.png
            test-output/install*/install-metrics.txt
            test-output/install*/guest-info-*.txt
            test-output/install*/serial-*.log
      - uses: actions/upload-artifact@v4
        with:
          name: iso
          path: |
            out/*.iso
            out/*.sha256
          retention-days: 7
          compression-level: 0
