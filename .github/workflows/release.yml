name: Release

# Pushing a tag like v0.1.0 builds the ISO, runs the boot test against the
# budget and publishes a GitHub release with everything attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

# GitHub's package mirror stalls now and then. Give up on a stuck download
# quickly and try again instead of hanging the job.
env:
  APT_OPTS: -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: Build the ISO
        run: scripts/build-iso.sh
      - name: Install QEMU and allow KVM
        run: |
          sudo apt-get $APT_OPTS update -q
          sudo apt-get $APT_OPTS install -y -q --no-install-recommends qemu-system-x86 qemu-utils
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot test
        run: scripts/boot-test.sh out/sengi-os-$(cat VERSION)-amd64.iso test-output
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          scripts/release-notes.sh "$version" test-output/metrics.txt >notes.md
          for shot in desktop hover session-menu quick-settings terminal launcher lock; do
            cp "test-output/$shot.png" "sengi-os-$version-$shot.png"
          done
          gh release create "$GITHUB_REF_NAME" --title "Sengi OS $version" --notes-file notes.md \
            "out/sengi-os-$version-amd64.iso" "out/sengi-os-$version-amd64.iso.sha256" \
            sengi-os-"$version"-*.png \
            test-output/metrics.txt
