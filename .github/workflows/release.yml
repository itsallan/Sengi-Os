name: Release

# Pushing a tag like v0.1.0 builds the ISO, runs the boot test against the
# budget and publishes a GitHub release with everything attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

# GitHub's package mirror stalls now and then. Give up on a stuck download
# quickly and try again instead of hanging the job.
env:
  APT_OPTS: -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=180
  # Never stop to ask a question nobody is there to answer.
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: Build the ISO
        run: scripts/build-iso.sh
      - name: Install QEMU and allow KVM
        timeout-minutes: 10
        run: |
          sudo -E apt-get $APT_OPTS update -q
          sudo -E apt-get $APT_OPTS install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf mtools dosfstools e2fsprogs
          # Let the runner's user open KVM. Setting the mode directly cannot
          # hang the way waiting on udev can.
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true
      - name: Boot test
        run: scripts/boot-test.sh out/sengi-os-$(cat VERSION)-amd64.iso test-output
      - name: Install test
        run: scripts/install-test.sh out/sengi-os-$(cat VERSION)-amd64.iso test-output/install
      # The same through UEFI, which is how the target machine starts. Its
      # figures are the ones the release notes lead with.
      - name: Install test, UEFI
        run: |
          SENGI_UEFI=/usr/share/OVMF/OVMF_CODE_4M.fd SENGI_UEFI_VARS=/usr/share/OVMF/OVMF_VARS_4M.fd \
            scripts/install-test.sh out/sengi-os-$(cat VERSION)-amd64.iso test-output/install-uefi
      - name: Install test, beside another system, UEFI
        run: |
          SENGI_INSTALL_MODE=beside SENGI_UEFI=/usr/share/OVMF/OVMF_CODE_4M.fd SENGI_UEFI_VARS=/usr/share/OVMF/OVMF_VARS_4M.fd \
            scripts/install-test.sh out/sengi-os-$(cat VERSION)-amd64.iso test-output/install-beside
      # No release ships that cannot make a full Windows volume smaller
      # without losing a file of it.
      - name: Install test, shrinking Windows, UEFI
        timeout-minutes: 30
        run: |
          rm -f test-output/install*/*.img test-output/install*/*.qcow2
          sudo -E apt-get $APT_OPTS install -y -q --no-install-recommends ntfs-3g attr
          sudo scripts/make-windows-volume.sh test-output/windows
          sudo chown -R "$USER" test-output/windows
          for fault in "" powercut; do
            SENGI_INSTALL_MODE=shrink SENGI_SHRINK_FAULT=$fault SENGI_NTFS=test-output/windows \
              SENGI_UEFI=/usr/share/OVMF/OVMF_CODE_4M.fd SENGI_UEFI_VARS=/usr/share/OVMF/OVMF_VARS_4M.fd \
              scripts/install-test.sh out/sengi-os-$(cat VERSION)-amd64.iso "test-output/install-shrink$fault"
            rm -f "test-output/install-shrink$fault"/*.img "test-output/install-shrink$fault"/*.raw
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          cp test-output/install-uefi/install-metrics.txt install-metrics-uefi.txt
          cp test-output/install/install-metrics.txt install-metrics-bios.txt
          scripts/release-notes.sh "$version" test-output/metrics.txt install-metrics-uefi.txt install-metrics-bios.txt >notes.md
          gh release create "$GITHUB_REF_NAME" --title "Sengi OS $version" --notes-file notes.md \
            "out/sengi-os-$version-amd64.iso" "out/sengi-os-$version-amd64.iso.sha256" \
            test-output/metrics.txt install-metrics-uefi.txt install-metrics-bios.txt
      # The test screenshots are kept with the run, not published.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-screenshots
          path: test-output/**/*.png
