[package]
name = "sengi-bar"
description = "The Sengi OS top bar"
version.workspace = true
edition.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
sengi-layer = { path = "../sengi-layer" }
# Not the workspace entry: that one pulls in the winit backend. sengi-layer
# is the backend here and turns on the software renderer.
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
slint-build.workspace = true
