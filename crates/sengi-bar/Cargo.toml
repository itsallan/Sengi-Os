[package]
name = "sengi-bar"
description = "The Sengi OS top bar"
version.workspace = true
edition.workspace = true
repository.workspace = true
build = "build.rs"

[features]
default = ["svg"]
# Many apps install only a scalable icon. Without this their tray icon is
# the letter tile.
svg = ["sengi-apps/svg"]

[dependencies]
# Tray icons named by file are found and decoded by this, in a child
# process, straight to the size they are drawn at.
sengi-apps = { path = "../sengi-apps", features = ["icons"] }
sengi-layer = { path = "../sengi-layer" }
sengi-system = { path = "../sengi-system", features = ["bus"] }
sengi-text = { path = "../sengi-text" }
# Not the workspace entry: that one pulls in the winit backend. sengi-layer
# is the backend here and turns on the software renderer.
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The clock's two settings, read from the settings file.
sengi-config = { path = "../sengi-config" }
# Reads a zone file, for a time zone chosen in Settings. chrono only knows
# the zone the process started in. No dependencies of its own.
tz-rs = "0.7"
# The tray speaks D-Bus. The notification service and quick settings use the
# same crate with the same features, so the image carries one D-Bus stack.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
# zbus takes its name-request flags as this crate's type and does not
# re-export it.
enumflags2 = "0.7"
# For a timeout on a single call: zbus's own is one for the whole
# connection. Both are what zbus itself runs on.
async-io = "2"
futures-lite = "2"
libc = "0.2"

[build-dependencies]
slint-build.workspace = true
