[package]
name = "sengi-launcher"
description = "The Sengi OS search launcher and menu"
version.workspace = true
edition.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
sengi-apps = { path = "../sengi-apps" }
sengi-layer = { path = "../sengi-layer" }
# No features: only the single-instance socket, which is plain std.
sengi-system = { path = "../sengi-system" }
# Not the workspace entry: that one pulls in the winit backend. sengi-layer
# is the backend here and turns on the software renderer.
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "std"] }

[dev-dependencies]
# Only examples/preview.rs opens a normal window.
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "std", "backend-winit"] }

[build-dependencies]
slint-build.workspace = true
