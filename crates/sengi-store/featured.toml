"com.obsproject.Studio" = "OBS Studio"
"io.github.seadve.Kooha" = "Kooha"

[Notes]
icon = "note-pencil"
"md.obsidian.Obsidian" = "Obsidian"
"net.cozic.joplin_desktop" = "Joplin"
"org.standardnotes.standardnotes" = "Standard Notes"
