[package]
name = "sengi-notify"
description = "The Sengi OS notification service and notification centre"
version.workspace = true
edition.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
sengi-layer = { path = "../sengi-layer" }
sengi-text = { path = "../sengi-text" }
sengi-tokens = { path = "../sengi-tokens" }
# Not the workspace entry: that one pulls in the winit backend. sengi-layer
# is the backend here and turns on the software renderer.
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "std"] }
# The blocking API over zbus's own small executor. No tokio.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
serde = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
slint-build.workspace = true
