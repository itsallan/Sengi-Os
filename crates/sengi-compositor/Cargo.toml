[package]
name = "sengi-compositor"
description = "Wayland compositor for Sengi OS"
version = "0.0.1"
edition = "2021"
publish = false

# Kept out of the main workspace on purpose: Smithay is a heavy dependency and
# this crate is not part of the ISO until it can replace labwc.
[workspace]

[features]
default = ["winit", "drm"]
# Runs the compositor in a window for development. Pulls in winit and GLES.
winit = ["smithay/backend_winit"]
# Runs the compositor on a real screen: libseat, udev, DRM/KMS and libinput.
drm = [
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_udev",
    "smithay/backend_libinput",
    "smithay/backend_session_libseat",
    # GLES on GBM, for displays with a GPU behind them.
    "smithay/backend_egl",
    "smithay/renderer_gl",
]

[dependencies]
# Rasterises the title bar text.
ab_glyph = "0.2"
# Reads the system cursor theme.
xcursor = "0.3"
# The same calloop Smithay uses, with signal handling switched on.
calloop = { version = "0.14", features = ["signals"] }
sengi-tokens = { path = "../sengi-tokens" }
smithay = { version = "0.7", default-features = false, features = [
    "desktop",
    "wayland_frontend",
    "renderer_pixman",
] }

[dev-dependencies]
# For examples/misbehave.rs, a client that tests how the compositor copes
# with requests it should refuse.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
