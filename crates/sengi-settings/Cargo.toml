[package]
name = "sengi-settings"
description = "The Sengi OS settings application"
version.workspace = true
edition.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
# The workspace entry is the winit backend with the software renderer:
# this is an ordinary window, not a layer-shell surface. The two extra
# features are what the software renderer needs to find Inter and to draw
# the icons, which are paths.
slint = { workspace = true, features = ["software-renderer-systemfonts", "software-renderer-path"] }

# The bus, iwd and BlueZ basics, the backlight, secrets, and the cleaning
# of names that strangers chose.
sengi-system = { path = "../sengi-system", features = ["services", "settings"] }
sengi-text = { path = "../sengi-text" }
# The settings file: its parser, its keys and which file wins. The bar
# reads the same file through the same crate.
sengi-config = { path = "../sengi-config" }

# The window's own Wayland connection belongs to the toolkit. The Display
# page has a second one for the output management protocol.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# The signal handlers, poll on the Wayland and bus descriptors, the pidfd
# that ends the idle daemon, and statvfs for the disk on the About page.
libc = "0.2"

[dev-dependencies]
sengi-system = { path = "../sengi-system", features = ["services", "settings", "testing"] }

[build-dependencies]
slint-build.workspace = true
