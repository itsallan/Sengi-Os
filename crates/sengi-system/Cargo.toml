[package]
name = "sengi-system"
description = "System services for the Sengi OS shell: buses, Wi-Fi, Bluetooth, audio, power"
version.workspace = true
edition.workspace = true
repository.workspace = true

[features]
# The hand-opened bus connections, for a program that speaks D-Bus itself.
bus = ["dep:zbus"]
# iwd, BlueZ, logind brightness, audio, battery, link state and rfkill, and
# the worker threads that run them.
services = ["bus", "dep:libc", "dep:sengi-text"]
# What a settings application manages and the panel does not. The image
# builds Settings apart from the other programs, so the panel there is
# compiled without this. A build of the whole workspace unifies features
# and turns it on for the panel too.
settings = ["services"]
# The builders of made-up bus objects, for the tests of a program that
# reads objects through this crate.
testing = ["services"]

[dependencies]
sengi-text = { path = "../sengi-text", optional = true }
# The blocking API on zbus's own small executor. No tokio.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"], optional = true }
# For prctl: a process that holds a passphrase is kept out of core dumps.
libc = { version = "0.2", optional = true }
