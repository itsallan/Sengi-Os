[package]
name = "sengi-clock"
description = "What a Sengi OS clock shows, following the clock settings"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The clock's two settings, read from the settings file.
sengi-config = { path = "../sengi-config" }
# Reads a zone file, for a time zone chosen in Settings. chrono only knows
# the zone the process started in. No dependencies of its own.
tz-rs = "0.7"
# For the timer that follows the wall clock through suspend.
libc = "0.2"
