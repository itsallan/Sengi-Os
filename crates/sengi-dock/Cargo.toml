[package]
name = "sengi-dock"
description = "The Sengi OS dock"
version.workspace = true
edition.workspace = true
repository.workspace = true
build = "build.rs"

[features]
default = ["svg"]
# Many apps install only a scalable icon. Without this they get the letter
# tile instead.
svg = ["sengi-apps/svg"]

[dependencies]
# Not the workspace entry: that one pulls in the winit backend, and the dock
# is drawn into a layer surface instead. sengi-layer turns on the renderer.
sengi-apps = { path = "../sengi-apps", features = ["icons"] }
sengi-layer = { path = "../sengi-layer" }
sengi-text = { path = "../sengi-text" }
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "std"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[dev-dependencies]
# The preview example opens an ordinary window.
slint = { workspace = true }
# The preview and the decoder test write their own icon files.
png = "0.18"

[build-dependencies]
slint-build.workspace = true
