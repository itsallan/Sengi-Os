[package]
name = "sengi-ui"
description = "The Sengi OS shared Slint component library"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
slint.workspace = true

[dev-dependencies]
# The pixel tests draw paths, which the crate tested on its own cannot do
# without this.
slint = { workspace = true, features = ["software-renderer-path"] }

[build-dependencies]
slint-build.workspace = true
