# Sengi OS design tokens. This is the only place colours, spacing, radius,
# type and motion are defined. Everything else references these by name,
# e.g. @{color.accent} in config templates or Tokens.color-accent in Slint.
#
# Colours are #rrggbb or #rrggbbaa. Sizes are in px, durations in ms.

[color]
desktop = "#121316"
bg = "#16171b"
surface = "#1f2126"
surface-raised = "#2a2d33"
surface-hover = "#33363d"
border = "#3a3d44"
text = "#eceef2"
text-muted = "#9a9fa8"
text-disabled = "#5f636b"
accent = "#d9773a"
accent-hover = "#e58a50"
accent-text = "#16171b"
danger = "#e5534b"
warning = "#e0a23b"
success = "#4cae6b"
bar = "#16171be6"
dock = "#1f2126e6"
scrim = "#00000080"
focus-ring = "#d9773a"
# The line around a control that cannot be used. It has to show on every
# surface a control can sit on, which a fill in a surface colour does not.
outline-disabled = "#4a4e56"

[radius]
base = 6

[space]
xxs = 2
xs = 4
sm = 8
md = 12
lg = 16
xl = 24

[border]
width = 1
# Line weight of drawn icons.
icon-stroke = 1.5
# Outline on the control that has keyboard focus.
focus-ring = 2

[type]
family = "Inter"
mono = "DejaVu Sans Mono"
size-sm = 11
size-md = 13
size-lg = 16
size-xl = 22
# Point sizes for programs that do not take px (labwc, foot).
pt-sm = 8
pt-md = 10
pt-lg = 12
weight-regular = 400
weight-medium = 500
weight-bold = 600

[size]
bar-height = 28
dock-icon = 40
dock-padding = 6
titlebar-height = 30
launcher-width = 640
menu-width = 320
notification-width = 360
bar-icon = 16
button = 26
launcher-lines = 8
lock-indicator = 64
lock-ring = 4
# A row of a list or of a card of settings.
list-row-height = 42
# A dialog, and a list to choose from, over a window.
dialog-width = 360
chooser-width = 480
chooser-lines = 8
# A value shown beside its control: "100%", "+100", "1000 ms".
value-column-sm = 40
value-column-md = 60
value-column-lg = 80
# How far Page Up and Page Down move, in percent of what is in view.
scroll-page-percent = 80
# The Settings window: its size when it opens, the smallest it goes, the
# list of pages at the left, the widest a page's column grows, and the
# control at the right of a row (wide for the ones that show a name).
settings-window-width = 888
settings-window-height = 600
settings-window-min-width = 720
settings-window-min-height = 480
settings-sidebar-width = 200
settings-page-width = 640
settings-control-width = 200
settings-control-wide = 240

[motion]
fast = 120
base = 200
slow = 320
easing = "cubic-bezier(0.2, 0, 0, 1)"

[timing]
notification-timeout = 5000
# How long a card that just appeared, changed or moved ignores clicks, so
# it cannot be slipped under a click that was meant for something else.
click-guard = 400
# How long a control moved by a held key stays quiet before it reports
# where it ended up, so key repeat is one change and not twenty a second.
input-settle = 300
idle-lock = 300
