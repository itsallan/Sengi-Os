# Sengi OS design tokens. This is the only place colours, spacing, radius,
# type and motion are defined. Everything else references these by name,
# e.g. @{color.accent} in config templates or Tokens.color-accent in Slint.
#
# Colours are #rrggbb or #rrggbbaa. Sizes are in px, durations in ms.

[color]
desktop = "#121316"
bg = "#16171b"
surface = "#1f2126"
surface-raised = "#2a2d33"
surface-hover = "#33363d"
border = "#3a3d44"
text = "#eceef2"
text-muted = "#9a9fa8"
text-disabled = "#5f636b"
accent = "#d9773a"
accent-hover = "#e58a50"
accent-text = "#16171b"
danger = "#e5534b"
warning = "#e0a23b"
success = "#4cae6b"
bar = "#16171be6"
dock = "#1f2126e6"
scrim = "#00000080"
focus-ring = "#d9773a"
# The line around a control that cannot be used. It has to show on every
# surface a control can sit on, which a fill in a surface colour does not.
outline-disabled = "#4a4e56"
# The three round buttons of a window frame, each with a darker ring, the
# glyph shown on them while the pointer is over the group, and the grey they
# all take when the window is not focused.
window-close = "#ff5f57"
window-close-ring = "#e0443e"
window-close-glyph = "#4d0000"
window-minimise = "#febc2e"
window-minimise-ring = "#dea123"
window-minimise-glyph = "#995700"
window-maximise = "#28c840"
window-maximise-ring = "#1aab29"
window-maximise-glyph = "#006500"
window-inactive = "#4d4d4d"

[radius]
base = 6

[space]
xxs = 2
xs = 4
sm = 8
md = 12
lg = 16
xl = 24
xxl = 48

[border]
width = 1
# Line weight of drawn icons.
icon-stroke = 1.5
# Outline on the control that has keyboard focus.
focus-ring = 2

[type]
family = "Inter"
mono = "DejaVu Sans Mono"
size-sm = 11
size-md = 13
size-lg = 16
size-xl = 22
# The time on the lock screen and the login screen.
size-display = 96
# How far below its baseline the typeface reaches, in percent of the type
# size. For setting two sizes of text on one baseline.
descent-percent = 24
# Point sizes for programs that do not take px (labwc, foot).
pt-sm = 8
pt-md = 10
pt-lg = 12
weight-regular = 400
weight-medium = 500
weight-bold = 600

[size]
bar-height = 28
dock-icon = 40
dock-padding = 6
titlebar-height = 30
launcher-width = 640
menu-width = 320
notification-width = 360
bar-icon = 16
button = 26
launcher-lines = 8
# The all-apps grid the launcher shows before anything is typed: columns and
# rows on screen, the size of one cell, the app icon in it, and the smaller
# icon beside a name in the list of results.
launcher-grid-columns = 6
launcher-grid-rows = 4
launcher-cell-width = 104
launcher-cell-height = 100
launcher-app-icon = 48
launcher-row-icon = 24
# The password field of the lock screen and the login screen, and one of
# the dots it shows for each character typed.
password-field-width = 280
password-field-height = 36
password-dot = 8
# The line under the field, kept free when it has nothing to say.
password-note-height = 20
# A row of a list or of a card of settings.
list-row-height = 42
# A dialog, and a list to choose from, over a window.
dialog-width = 360
chooser-width = 480
chooser-lines = 8
# A value shown beside its control: "100%", "+100", "1000 ms".
value-column-sm = 40
value-column-md = 60
value-column-lg = 80
# How far Page Up and Page Down move, in percent of what is in view.
scroll-page-percent = 80
# The Settings window: its size when it opens, the smallest it goes, the
# list of pages at the left, the widest a page's column grows, and the
# control at the right of a row (wide for the ones that show a name).
settings-window-width = 888
settings-window-height = 600
settings-window-min-width = 720
settings-window-min-height = 480
settings-sidebar-width = 200
settings-page-width = 640
settings-control-width = 200
settings-control-wide = 240

[window]
# The round buttons in the title bar: their diameter, the space between two,
# the space from the frame edge to the first, the width of the ring around
# each, the side of the glyph box and its stroke, and how much darker a
# pressed button is, in percent.
button = 12
button-gap = 8
button-inset = 12
button-ring = 0.5
button-glyph = 6
button-glyph-stroke = 1.5
button-pressed-darken = 15

[shadow]
# The soft shadow around a framed window, drawn as flat translucent rounded
# rectangles stacked outwards, no gradient: how many, how far the outermost
# reaches past the frame, how far down the whole shadow is moved, and how
# dark the nearest one is (in percent) for the focused window and for the
# others. Zero steps turn shadows off.
steps = 8
spread = 20
offset = 8
alpha-focused = 55
alpha-unfocused = 30
color = "#000000"

[menu]
# A menu's rows: the height of a row, the space between the menu's edge and
# its rows, and how far a separator line is pulled in from the row's ends.
row = 22
padding = 6
separator-inset = 6

[dock]
# The shelf the dock sits on. The icon is the visible app icon; the gap is the
# space between two icons, kept the same next to every one; the padding is at
# each end of the shelf (above and below the icons it is size.dock-padding);
# the margin lifts the shelf off the bottom of the screen. The dot under a
# running app is `dot` wide, `dot-gap` below the icon. A launching icon
# jumps `bounce` high.
icon = 48
gap = 14
end-padding = 10
margin = 6
dot = 4
dot-gap = 3
bounce = 8

[osd]
# The indicator that shows a level after a volume or brightness key: its
# size, the icon in it, the thickness of the bar, and how far it floats above
# the bottom edge of the screen (clear of the dock).
width = 240
height = 56
icon = 24
bar = 6
margin = 96

[motion]
fast = 120
base = 200
slow = 320
easing = "cubic-bezier(0.2, 0, 0, 1)"
# How long the launch bounce takes up and down together, and how it eases.
bounce-duration = 300
bounce-easing = "ease-out"

[timing]
notification-timeout = 5000
# How long the level indicator stays after the last key.
osd-timeout = 1200
# How long a card that just appeared, changed or moved ignores clicks, so
# it cannot be slipped under a click that was meant for something else.
click-guard = 400
# How long the quick settings panel is gone before Screenshot takes the
# picture, so the panel and its fade are not in it.
screenshot-delay = 400
# How long a control moved by a held key stays quiet before it reports
# where it ended up, so key repeat is one change and not twenty a second.
input-settle = 300
idle-lock = 300
# How long the lock screen keeps its password field up with nothing typed
# and the pointer still, before only the clock is left.
lock-prompt-hide = 30000
# How long Restart and Shut down on the login screen wait, after a first
# press, for the second press that carries them out.
power-confirm = 5000
